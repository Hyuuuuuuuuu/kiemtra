<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigenere Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">BẢO MẬT THÔNG TIN NÂNG CAO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/caesar">Caesar Cipher</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/vigenere">Vigenere Cipher</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container container-custom">
        <h1 class="text-center mb-4">VIGENERE CIPHER</h1>

        <!-- Encryption Section -->
<div class="encrypt-section">
    <h3>ENCRYPTION</h3>
    <form method="POST" action="/vigenere/encrypt">
        <div class="mb-3">
            <label class="form-label">Plain Text:</label>
            <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Key:</label>
            <input type="text" class="form-control" name="inputKeyPlain" placeholder="Input Key" required>
        </div>
        <button type="submit" class="btn btn-primary">Encrypt</button>
    </form>
</div>

<!-- Decryption Section -->
<div class="decrypt-section">
    <h3>DECRYPTION</h3>
    <form method="POST" action="/vigenere/decrypt">
        <div class="mb-3">
            <label class="form-label">Cipher Text:</label>
            <input type="text" class="form-control" name="inputCipherText" placeholder="Input Cipher Text" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Key:</label>
            <input type="text" class="form-control" name="inputKeyCipher" placeholder="Input Key" required>
        </div>
        <button type="submit" class="btn btn-success">Decrypt</button>
    </form>
</div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
